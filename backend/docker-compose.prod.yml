services:

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

    volumes:
      - rift-postgres-prod-data:/var/lib/postgresql/data

    networks:
      - rift-prod-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - rift-redis-prod-data:/data

    networks:
      - rift-prod-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    stop_grace_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env.production

    environment:
      APP_ENV: production

      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DOCKER_ENV: "true"
      ENABLE_WORKERS: "true"

    networks:
      - rift-prod-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3


  nginx:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - rift-prod-network


volumes:
  rift-postgres-prod-data:
  rift-redis-prod-data:


networks:
  rift-prod-network: