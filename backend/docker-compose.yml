services:

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

    ports:
      - "5432:5432"

    volumes:
      - rift-postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7.4

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]


    volumes:
      - rift-redis-prod-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      APP_ENV: development

      POSTGRES_HOST: postgres
      REDIS_HOST: redis

      DOCKER_ENV: "true"

      ENABLE_WORKERS: "true"

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3


volumes:
  rift-postgres-prod-data:

  rift-redis-prod-data: